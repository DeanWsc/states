<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Broken on purpose</title>
<!--
  Every defect scripts/check.mjs exists to catch, one per element. This file
  must keep failing; if it ever passes, a check has stopped checking.
  scripts/check.test.mjs asserts which checks fire, not just that it fails.
-->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body { background: #20232a; color: #f5f5f5; font-family: Arial, "WenQuanYi Zen Hei", sans-serif; }
  p { position: absolute; }
  /* safe-area: pinned to the corner, where a TV crops it. */
  #corner { left: 8px; top: 8px; font-size: 40px; }
  /* font-size: legal-print small. */
  #tiny { left: 120px; top: 200px; font-size: 13px; }
  /* contrast: dark grey on a dark background. */
  #murky { left: 120px; top: 300px; font-size: 40px; color: #4a4e57; }
  /* reading-time: a full sentence on screen for a third of a second. */
  #flash { left: 120px; top: 420px; font-size: 40px; opacity: 0; }
  /* determinism: a counter that counts calls, not time. */
  #calls { left: 120px; top: 540px; font-size: 40px; }
</style>
</head>
<body>
  <p id="corner">Breaking news</p>
  <p id="tiny">Terms and conditions apply to every offer shown in this video</p>
  <p id="murky">Hard to read</p>
  <p id="flash">This sentence is far too long to read in a blink</p>
  <p id="calls">0</p>
  <script>
    let calls = 0;
    window.__reel = {
      width: 1280, height: 720, fps: 30, duration: 3,
      seek(t) {
        document.getElementById("flash").style.opacity = t >= 1 && t < 1.33 ? 1 : 0;
        document.getElementById("calls").textContent = "Seen " + ++calls + " times";
      },
    };
  </script>
</body>
</html>
