; ESP32-S3 firmware for iphone-agent: a BLE mouse + keyboard driven over USB serial.
; Build:   pio run
; Flash:   pio run -t upload        (hold BOOT while plugging in if the port does not show up)
; Monitor: pio device monitor
[env:esp32-s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Use the S3's native USB port as the serial port (the one the computer side talks to).
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    h2zero/NimBLE-Arduino@2.1.0
    bblanchon/ArduinoJson@7.2.1
